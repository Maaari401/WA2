openapi: 3.1.0
info:
  title: WA2 Ticketing Platform - Shared Components (Group 6)
  version: 1.1.0
  description: >
    Components shared by every service specification.
    All error documents follow the RFC 9457 (application/problem+json) standard.
    Every service verifies the JWT on its own (the API Gateway is not the only check).
    Money amounts are always integers in minor units (cents) plus an ISO 4217 currency, never floating point.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        OIDC access token issued by Keycloak. Verified by the API Gateway and again by each service.
        Roles used: `organiser`, `customer`, `gate-staff`.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Client-generated unique key (UUID) making the request safe to retry.
        Same key + same body → the original response is replayed, no new resource is created.
        Same key + different body → 422.
      schema: { type: string, format: uuid, example: "3f0e9c2a-7d1b-4b8e-a6f5-2c9d8e7f6a5b" }
    Limit:
      name: limit
      in: query
      description: Number of items per page (default 50, max 100)
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned as `nextCursor` by the previous page
      schema: { type: string }

  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Document
      required: [title, status, detail]
      properties:
        type:
          type: string
          format: uri
          example: "https://tickets.example.com/problems/seat-not-free"
        title:
          type: string
          example: "Seat not free"
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: "The seat PLATEA-E14 of session 9001 is already held or sold."
        instance:
          type: string
          example: "/api/v1/sessions/9001/holds"

    Currency:
      type: string
      description: ISO 4217 currency code
      pattern: "^[A-Z]{3}$"
      example: "EUR"

    SeatLabel:
      type: string
      description: "`<SECTOR>-<ROW><NUMBER>`, generated by Inventory & Orders from the fixed venue layout"
      pattern: "^[A-Z0-9_]+-[A-Z]+[0-9]+$"
      example: "PLATEA-E14"

  responses:
    MalformedRequest:
      description: The request cannot be read syntactically (body, query, or path)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Action not authorized for the current user (wrong role or not the owner of the resource)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: The URL names no resource
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: State conflict on the resource (e.g., seat already held, hold expired, sales not open yet)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationFailed:
      description: Input parameter validation failed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    GatewayTimeout:
      description: Timeout expired during synchronous inter-service call (e.g., > 2s for Payments)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
